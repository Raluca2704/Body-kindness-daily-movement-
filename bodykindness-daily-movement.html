<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Daily Movement" />
  <title>BodyKindness · Daily Movement</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: linear-gradient(160deg, #fdf8f3 0%, #f5ede8 40%, #ede8f5 100%);
      font-family: 'Georgia', 'Times New Roman', serif;
      padding-bottom: 60px;
    }

    /* Header */
    .header {
      text-align: center;
      padding: 52px 24px 32px;
    }

    .brand {
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #b09080;
      margin-bottom: 8px;
    }

    h1 {
      font-size: clamp(26px, 7vw, 36px);
      font-weight: 400;
      color: #4a3728;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    .date-str {
      font-size: 14px;
      color: #9a8070;
      font-style: italic;
      margin-bottom: 24px;
    }

    .quote-box {
      max-width: 320px;
      margin: 0 auto 24px;
      font-size: 14px;
      color: #7a6858;
      font-style: italic;
      line-height: 1.7;
      padding: 16px 20px;
      background: rgba(255,255,255,0.5);
      border-radius: 12px;
      border: 1px solid rgba(180,150,130,0.2);
    }

    /* Progress */
    .progress-wrap {
      max-width: 320px;
      margin: 0 auto;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #9a8070;
      letter-spacing: 1px;
      margin-bottom: 8px;
      font-family: sans-serif;
      text-transform: uppercase;
    }

    .progress-label span:last-child {
      font-weight: 600;
      color: #7a6858;
    }

    .progress-track {
      height: 6px;
      background: rgba(180,150,130,0.2);
      border-radius: 100px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #c4956a, #c47a8a, #9b7db8);
      border-radius: 100px;
      transition: width 0.6s ease;
      width: 0%;
    }

    /* Cards */
    .cards {
      max-width: 420px;
      margin: 28px auto 0;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card {
      background: rgba(255,255,255,0.7);
      border-radius: 18px;
      padding: 18px 20px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    }

    .card.done {
      background: rgba(255,255,255,0.35);
      opacity: 0.6;
      box-shadow: none;
    }

    .card-top {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .icon-circle {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .card-text { flex: 1; }

    .card-time {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
      font-family: sans-serif;
    }

    .card-title {
      font-size: 16px;
      font-weight: 400;
      color: #3a2a1e;
      line-height: 1.3;
    }

    .card.done .card-title {
      text-decoration: line-through;
      color: #9a8070;
    }

    .card-sub {
      font-size: 12px;
      color: #9a8070;
      margin-top: 2px;
      font-style: italic;
    }

    .check-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2px solid;
      background: transparent;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.25s ease;
      font-family: sans-serif;
    }

    .check-btn:active { transform: scale(0.9); }

    /* Expanded detail */
    .card-detail {
      display: none;
      margin-top: 16px;
      padding-top: 16px;
      animation: fadeIn 0.3s ease;
    }

    .card-detail.open { display: block; }

    .card-desc {
      font-size: 13px;
      color: #7a6858;
      line-height: 1.7;
      font-style: italic;
      margin-bottom: 14px;
    }

    .card-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .badge {
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 5px 12px;
      border-radius: 100px;
      font-family: sans-serif;
    }

    .btn-link {
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #fff;
      padding: 5px 14px;
      border-radius: 100px;
      text-decoration: none;
      font-family: sans-serif;
    }

    /* Celebration */
    .celebration {
      display: none;
      text-align: center;
      padding: 36px 24px 0;
      max-width: 320px;
      margin: 0 auto;
    }

    .celebration.visible { display: block; }

    .celebration-emoji {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .celebration-text {
      font-size: 16px;
      color: #7a6858;
      font-style: italic;
      line-height: 1.7;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="brand">Body Kindness</div>
    <h1>Daily Movement</h1>
    <div class="date-str" id="dateStr"></div>
    <div class="quote-box" id="quoteBox"></div>
    <div class="progress-wrap">
      <div class="progress-label">
        <span>Progress</span>
        <span id="progressCount">0 / 5</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>
  </div>

  <div class="cards" id="cardsContainer"></div>

  <div class="celebration" id="celebration">
    <div class="celebration-emoji">🌸</div>
    <div class="celebration-text">You showed up fully today, Ralu.<br>Your body thanks you.</div>
  </div>

  <script>
    const workouts = [
      {
        id: 1,
        time: "6:30 AM", title: "Morning Yoga & Stretch",
        subtitle: "Gentle awakening ritual", duration: "10 min", icon: "🌅",
        typeLabel: "Yoga Mat", color: "#e8d5c4", accent: "#c4956a",
        description: "Begin on your mat. Let breath lead the body into wakefulness.",
        link: null, linkLabel: null
      },
      {
        id: 2,
        time: "7:15 AM", title: "Lymphatic Flow",
        subtitle: "Before breakfast activation", duration: "10 min", icon: "🌿",
        typeLabel: "YouTube", color: "#d4e4d8", accent: "#7aab82",
        description: "Gentle lymphatic drainage to awaken the body's natural detox pathways.",
        link: "https://youtu.be/hFteQ6JXoN0?is=4b8TQKbwTdYhGZh9", linkLabel: "▶ Open Video"
      },
      {
        id: 3,
        time: "2:00 PM", title: "Organ Flash-out",
        subtitle: "One hour after lunch", duration: "20 min", icon: "✨",
        typeLabel: "YouTube", color: "#e8dff0", accent: "#9b7db8",
        description: "Support digestion and organ vitality with intentional movement.",
        link: "https://youtu.be/hSTwUxI_wWY?is=PQLOkYHk0UM_B-4K", linkLabel: "▶ Open Video"
      },
      {
        id: 4,
        time: "8:00 PM", title: "Asian Pilates",
        subtitle: "One hour after dinner", duration: "30 min", icon: "🌸",
        typeLabel: "Organic Fit App", color: "#f0dde4", accent: "#c47a8a",
        description: "Mindful Pilates flow for an evening reset. Open your Organic Fit app.",
        link: "https://apps.apple.com/app/id1188810254", linkLabel: "↗ Open App"
      },
      {
        id: 5,
        time: "10:30 PM", title: "Wind-down Ritual",
        subtitle: "Before sleep preparation", duration: "10 min", icon: "🌙",
        typeLabel: "Yoga Mat", color: "#dde4f0", accent: "#7a8bbf",
        description: "Close the day gently. Breathe, release, and prepare for deep rest.",
        link: null, linkLabel: null
      }
    ];

    const quotes = [
      "Your body is worthy of care, every single day.",
      "Movement is a conversation with yourself.",
      "Every gentle step is an act of kindness.",
      "Your body knows the way — trust it.",
      "Care begins with showing up, softly.",
      "Rest is not absence of effort — it is wisdom.",
      "You are allowed to take up space, gently."
    ];

    const today = new Date();
    const todayKey = "bk-checks-" + today.toISOString().slice(0, 10);
    let checked = {};
    let expandedId = null;

    // Load saved state
    try {
      const saved = localStorage.getItem(todayKey);
      if (saved) checked = JSON.parse(saved);
    } catch(e) {}

    // Date
    document.getElementById("dateStr").textContent = today.toLocaleDateString("en-GB", {
      weekday: "long", day: "numeric", month: "long"
    });

    // Quote
    document.getElementById("quoteBox").textContent = "\u201c" + quotes[today.getDay() % quotes.length] + "\u201d";

    function save() {
      try { localStorage.setItem(todayKey, JSON.stringify(checked)); } catch(e) {}
    }

    function updateProgress() {
      const count = Object.values(checked).filter(Boolean).length;
      const pct = Math.round((count / workouts.length) * 100);
      document.getElementById("progressCount").textContent = count + " / " + workouts.length;
      document.getElementById("progressFill").style.width = pct + "%";
      document.getElementById("celebration").classList.toggle("visible", count === workouts.length);
    }

    function renderCards() {
      const container = document.getElementById("cardsContainer");
      container.innerHTML = "";

      workouts.forEach(w => {
        const done = !!checked[w.id];
        const expanded = expandedId === w.id;

        const card = document.createElement("div");
        card.className = "card" + (done ? " done" : "");
        card.style.border = "1.5px solid " + (done ? "rgba(180,150,130,0.15)" : w.accent + "40");

        card.innerHTML = `
          <div class="card-top">
            <div class="icon-circle" style="background:${w.color}">
              ${done ? "✓" : w.icon}
            </div>
            <div class="card-text">
              <div class="card-time" style="color:${w.accent}">${w.time} · ${w.duration}</div>
              <div class="card-title">${w.title}</div>
              <div class="card-sub">${w.subtitle}</div>
            </div>
            <button class="check-btn"
              style="border-color:${done ? w.accent : w.accent + "60"};
                     background:${done ? w.accent : "transparent"};
                     color:${done ? "#fff" : w.accent}"
              data-id="${w.id}"
            >${done ? "✓" : ""}</button>
          </div>
          <div class="card-detail${expanded ? " open" : ""}" style="border-top:1px solid ${w.accent}25">
            <p class="card-desc">${w.description}</p>
            <div class="card-actions">
              <span class="badge" style="color:${w.accent};background:${w.color}cc">${w.typeLabel}</span>
              ${w.link ? `<a class="btn-link" href="${w.link}" target="_blank" style="background:${w.accent}">${w.linkLabel}</a>` : ""}
            </div>
          </div>
        `;

        // Toggle expand on card click
        card.addEventListener("click", (e) => {
          if (e.target.closest(".check-btn") || e.target.closest("a")) return;
          expandedId = (expandedId === w.id) ? null : w.id;
          renderCards();
        });

        // Check button
        card.querySelector(".check-btn").addEventListener("click", (e) => {
          e.stopPropagation();
          checked[w.id] = !checked[w.id];
          save();
          updateProgress();
          renderCards();
        });

        container.appendChild(card);
      });
    }

    renderCards();
    updateProgress();
  </script>
</body>
</html>
